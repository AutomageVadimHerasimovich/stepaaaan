<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <a class="logout-link fancy-logout" href="/logout">
        <span>Выйти</span>
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" style="vertical-align:middle;margin-left:8px;">
            <path d="M16 17L21 12L16 7" stroke="#ee0979" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M21 12H9" stroke="#ee0979" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M5 3H12C13.1046 3 14 3.89543 14 5V7" stroke="#ee0979" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M14 17V19C14 20.1046 13.1046 21 12 21H5C3.89543 21 3 20.1046 3 19V5C3 3.89543 3.89543 3 5 3Z" stroke="#ee0979" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
    </a>
    <title>Админ-панель | Library</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css?family=Montserrat:700,900&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #ee0979 0%, #ff6a00 100%);
            min-height: 100vh;
            font-family: 'Montserrat', Arial, sans-serif;
            overflow-x: hidden;
        }
        .header {
            text-align: center;
            padding: 40px 0 20px 0;
            color: #fff;
            font-size: 2.8rem;
            font-weight: 900;
            letter-spacing: 2px;
            text-shadow: 0 2px 20px #ee0979;
            animation: fadeInDown 1.2s cubic-bezier(.42,0,.58,1);
        }
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-40px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .main {
            max-width: 1100px;
            margin: 0 auto;
            background: rgba(255,255,255,0.15);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
            border-radius: 20px;
            padding: 40px 30px 60px 30px;
            animation: fadeIn 1.2s cubic-bezier(.42,0,.58,1);
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
            margin-bottom: 30px;
        }
        .action {
            background: linear-gradient(90deg, #ee0979 0%, #ff6a00 100%);
            color: #fff;
            border: none;
            border-radius: 30px;
            padding: 16px 32px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 16px rgba(238,9,121,0.2);
            transition: transform 0.2s, box-shadow 0.2s;
            animation: btnAppear 1.5s cubic-bezier(.42,0,.58,1);
        }
        .action:hover {
            transform: scale(1.08);
            box-shadow: 0 8px 32px rgba(238,9,121,0.3);
        }
        @keyframes btnAppear {
            from { opacity: 0; transform: scale(0.7); }
            to { opacity: 1; transform: scale(1); }
        }
        .search-block {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 30px;
        }
        .search-block input {
            padding: 10px 18px;
            border-radius: 20px;
            border: none;
            font-size: 1rem;
            width: 220px;
        }
        .search-block button {
            background: linear-gradient(90deg, #ee0979 0%, #ff6a00 100%);
            color: #fff;
            border: none;
            border-radius: 20px;
            padding: 10px 24px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(238,9,121,0.2);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .search-block button:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 16px rgba(238,9,121,0.3);
        }
        .books-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            background: rgba(255,255,255,0.7);
            border-radius: 12px;
            overflow: hidden;
            animation: tableFade 1.2s cubic-bezier(.42,0,.58,1);
        }
        @keyframes tableFade {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .books-table th, .books-table td {
            padding: 14px 10px;
            text-align: left;
        }
        .books-table th {
            background: linear-gradient(90deg, #ee0979 0%, #ff6a00 100%);
            color: #fff;
            font-size: 1.1rem;
        }
        .books-table tr {
            transition: background 0.2s;
        }
        .books-table tr:hover {
            background: #ffe3e3;
        }
        .books-table td {
            font-size: 1rem;
        }
        .edit-btn, .delete-btn {
            padding: 8px 18px;
            border-radius: 20px;
            border: none;
            font-weight: 700;
            cursor: pointer;
            margin-right: 8px;
            transition: background 0.2s, transform 0.2s;
        }
        .edit-btn {
            background: linear-gradient(90deg, #ffb347 0%, #ffcc33 100%);
            color: #333;
        }
        .edit-btn:hover {
            background: #ffe066;
            transform: scale(1.08);
        }
        .delete-btn {
            background: linear-gradient(90deg, #ee0979 0%, #ff6a00 100%);
            color: #fff;
        }
        .delete-btn:hover {
            background: #ff6a00;
            transform: scale(1.08);
        }
        .modal {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }
        .modal.active {
            opacity: 1;
            pointer-events: auto;
        }
        .modal-content {
            background: #fff;
            border-radius: 20px;
            padding: 40px 30px;
            min-width: 320px;
            max-width: 400px;
            box-shadow: 0 8px 32px rgba(31,38,135,0.37);
            animation: modalFade 0.5s cubic-bezier(.42,0,.58,1);
        }
        @keyframes modalFade {
            from { opacity: 0; transform: scale(0.8); }
            to { opacity: 1; transform: scale(1); }
        }
        .modal-content h2 {
            margin-top: 0;
            font-size: 1.5rem;
            color: #ee0979;
            text-align: center;
        }
        .modal-content label {
            display: block;
            margin-top: 18px;
            font-weight: 700;
            color: #333;
        }
        .modal-content input, .modal-content textarea {
            width: 100%;
            padding: 10px 14px;
            border-radius: 12px;
            border: 1px solid #eee;
            margin-top: 6px;
            font-size: 1rem;
        }
        .modal-content textarea {
            resize: vertical;
            min-height: 60px;
        }
        .modal-content .modal-actions {
            margin-top: 28px;
            text-align: center;
        }
        .modal-content .modal-actions button {
            padding: 10px 28px;
            border-radius: 20px;
            border: none;
            font-weight: 700;
            cursor: pointer;
            margin-right: 8px;
            font-size: 1rem;
            background: linear-gradient(90deg, #ee0979 0%, #ff6a00 100%);
            color: #fff;
            box-shadow: 0 2px 8px rgba(238,9,121,0.2);
            transition: background 0.2s, transform 0.2s;
        }
        .modal-content .modal-actions button:hover {
            background: #ff6a00;
            transform: scale(1.08);
        }
        .modal-close {
            position: absolute;
            top: 18px;
            right: 24px;
            font-size: 1.5rem;
            color: #ee0979;
            cursor: pointer;
            font-weight: 900;
        }
        .fade-enter {
            animation: fadeIn 0.7s cubic-bezier(.42,0,.58,1);
        }
        .fade-leave {
            animation: fadeOut 0.7s cubic-bezier(.42,0,.58,1);
        }
        @keyframes fadeOut {
            from { opacity: 1; }
            to { opacity: 0; }
        }
        .waves {
            position: absolute;
            left: 0; right: 0; bottom: -40px;
            width: 100%;
            height: 120px;
            z-index: -1;
        }
        .waves svg {
            width: 100%;
            height: 100%;
            display: block;
            animation: waveMove 8s linear infinite;
        }
        @keyframes waveMove {
            0% { transform: translateX(0); }
            100% { transform: translateX(-100px); }
        }
        .fancy-logout {
            position: absolute;
            top: 30px;
            right: 40px;
            display: inline-flex;
            align-items: center;
            background: linear-gradient(90deg, #ee0979 0%, #ff6a00 100%);
            color: #fff !important;
            font-weight: 700;
            border-radius: 30px;
            padding: 12px 28px;
            box-shadow: 0 4px 16px rgba(238,9,121,0.15);
            text-decoration: none;
            font-size: 1.1rem;
            transition: background 0.2s, transform 0.2s, box-shadow 0.2s;
            border: none;
            z-index: 10;
        }
        .fancy-logout:hover {
            background: linear-gradient(90deg, #ff6a00 0%, #ee0979 100%);
            color: #fff;
            transform: scale(1.08);
            box-shadow: 0 8px 32px rgba(238,9,121,0.25);
        }
        .fancy-logout svg {
            transition: transform 0.3s;
        }
        .fancy-logout:hover svg {
            transform: translateX(6px);
        }
    </style>
</head>
<body>
    <div class="header">Админ-панель библиотеки</div>
    <div class="main">
        <div class="actions">
            <button class="action" onclick="openAddModal()">Добавить книгу</button>
            <button class="action" onclick="fetchAllBooks()">Обновить список книг</button>
        </div>
        <div class="search-block">
            <input type="text" id="searchId" placeholder="Поиск по ID">
            <button onclick="searchById()">Найти</button>
            <input type="text" id="searchIsbn" placeholder="Поиск по ISBN">
            <button onclick="searchByIsbn()">Найти</button>
        </div>
        <div id="booksContainer"></div>
    </div>
    <div class="waves">
        <svg viewBox="0 0 1200 120" preserveAspectRatio="none">
            <path d="M0,0 C300,100 900,0 1200,100 L1200,120 L0,120 Z" fill="#fff" fill-opacity="0.3">
                <animate attributeName="d" dur="6s" repeatCount="indefinite"
                    values="M0,0 C300,100 900,0 1200,100 L1200,120 L0,120 Z;
                            M0,0 C400,0 800,100 1200,0 L1200,120 L0,120 Z;
                            M0,0 C300,100 900,0 1200,100 L1200,120 L0,120 Z" />
            </path>
        </svg>
    </div>
    <div class="modal" id="bookModal">
        <div class="modal-content">
            <span class="modal-close" onclick="closeModal()">&times;</span>
            <h2 id="modalTitle">Добавить книгу</h2>
            <form id="bookForm">
                <input type="hidden" id="bookId">
                <label>Название</label>
                <input type="text" id="bookTitle" required>
                <label>Автор</label>
                <input type="text" id="bookAuthor" required>
                <label>ISBN</label>
                <input type="text" id="bookIsbn" required>
                <label>Жанр</label>
                <input type="text" id="bookGenre" required>
                <label>Описание</label>
                <textarea id="bookDescription" required></textarea>
                <div class="modal-actions">
                    <button type="submit" id="modalSaveBtn">Сохранить</button>
                    <button type="button" onclick="closeModal()">Отмена</button>
                </div>
            </form>
        </div>
    </div>
    <script>
        const API = {
            all: '/api/library/allbooks',
            byId: id => `/api/library/${id}`,
            byIsbn: isbn => `/api/library/isbn/${isbn}`,
            add: '/api/library/addbook',
            update: id => `/api/library/${id}`,
            delete: id => `/api/library/${id}`
        };

        async function fetchAllBooks() {
            const res = await fetch(API.all);
            const books = await res.json();
            renderBooksTable(books);
        }

        async function searchById() {
            const id = document.getElementById('searchId').value.trim();
            if (!id) return;
            const res = await fetch(API.byId(id));
            if (res.ok) {
                const book = await res.json();
                renderBooksTable([book]);
            } else {
                renderBooksTable([]);
            }
        }

        async function searchByIsbn() {
            const isbn = document.getElementById('searchIsbn').value.trim();
            if (!isbn) return;
            const res = await fetch(API.byIsbn(isbn));
            if (res.ok) {
                const book = await res.json();
                renderBooksTable([book]);
            } else {
                renderBooksTable([]);
            }
        }

        function renderBooksTable(books) {
            const container = document.getElementById('booksContainer');
            if (!books || books.length === 0) {
                container.innerHTML = '<div style="text-align:center;color:#ee0979;font-size:1.3rem;margin-top:30px;">Нет данных</div>';
                return;
            }
            let html = `<table class="books-table fade-enter">
                <thead><tr>
                    <th>ID</th><th>Название</th><th>Автор</th><th>ISBN</th><th>Жанр</th><th>Описание</th><th>Действия</th>
                </tr></thead><tbody>`;
            for (const book of books) {
                html += `<tr>
                    <td>${book.id}</td>
                    <td>${book.title}</td>
                    <td>${book.author}</td>
                    <td>${book.isbn}</td>
                    <td>${book.genre}</td>
                    <td>${book.description}</td>
                    <td>
                        <button class="edit-btn" onclick="openEditModal(${book.id})">Редактировать</button>
                        <button class="delete-btn" onclick="deleteBook(${book.id})">Удалить</button>
                    </td>
                </tr>`;
            }
            html += '</tbody></table>';
            container.innerHTML = html;
        }

        function openAddModal() {
            document.getElementById('modalTitle').textContent = 'Добавить книгу';
            document.getElementById('bookForm').reset();
            document.getElementById('bookId').value = '';
            document.getElementById('bookModal').classList.add('active');
            document.getElementById('modalSaveBtn').onclick = saveBook;
        }

        async function openEditModal(id) {
            const res = await fetch(API.byId(id));
            if (!res.ok) return;
            const book = await res.json();
            document.getElementById('modalTitle').textContent = 'Редактировать книгу';
            document.getElementById('bookId').value = book.id;
            document.getElementById('bookTitle').value = book.title;
            document.getElementById('bookAuthor').value = book.author;
            document.getElementById('bookIsbn').value = book.isbn;
            document.getElementById('bookGenre').value = book.genre;
            document.getElementById('bookDescription').value = book.description;
            document.getElementById('bookModal').classList.add('active');
            document.getElementById('modalSaveBtn').onclick = updateBook;
        }

        async function saveBook(e) {
            e.preventDefault();
            const book = getBookFormData();
            const res = await fetch(API.add, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(book)
            });
            if (res.ok) {
                closeModal();
                fetchAllBooks();
            } else {
                alert('Ошибка при добавлении книги');
            }
        }

        async function updateBook(e) {
            e.preventDefault();
            const id = document.getElementById('bookId').value;
            const book = getBookFormData();
            const res = await fetch(API.update(id), {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(book)
            });
            if (res.ok) {
                closeModal();
                fetchAllBooks();
            } else {
                alert('Ошибка при обновлении книги');
            }
        }

        async function deleteBook(id) {
            if (!confirm('Удалить книгу?')) return;
            const res = await fetch(API.delete(id), { method: 'DELETE' });
            if (res.ok) {
                fetchAllBooks();
            } else {
                alert('Ошибка при удалении книги');
            }
        }

        function getBookFormData() {
            return {
                title: document.getElementById('bookTitle').value,
                author: document.getElementById('bookAuthor').value,
                isbn: document.getElementById('bookIsbn').value,
                genre: document.getElementById('bookGenre').value,
                description: document.getElementById('bookDescription').value
            };
        }

        function closeModal() {
            document.getElementById('bookModal').classList.remove('active');
        }

        window.onload = fetchAllBooks;
    </script>
</body>
</html>
