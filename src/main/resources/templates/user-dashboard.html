<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Панель пользователя | Library</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css?family=Montserrat:700,900&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #2575fc 0%, #6a11cb 100%);
            min-height: 100vh;
            font-family: 'Montserrat', Arial, sans-serif;
            overflow-x: hidden;
        }
        .header {
            text-align: center;
            padding: 40px 0 20px 0;
            color: #fff;
            font-size: 2.2rem;
            font-weight: 900;
            letter-spacing: 2px;
            text-shadow: 0 2px 20px #2575fc;
            animation: fadeInDown 1.2s cubic-bezier(.42,0,.58,1);
        }
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-40px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .main {
            max-width: 900px;
            margin: 0 auto;
            background: rgba(255,255,255,0.15);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
            border-radius: 20px;
            padding: 40px 30px 60px 30px;
            animation: fadeIn 1.2s cubic-bezier(.42,0,.58,1);
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
        .logout-link {
            float: right;
            color: #2575fc;
            text-decoration: none;
            font-weight: 500;
            margin-top: 10px;
        }
        .logout-link:hover {
            text-decoration: underline;
        }
        .search-block {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 30px;
        }
        .search-block input {
            padding: 10px 18px;
            border-radius: 20px;
            border: none;
            font-size: 1rem;
            width: 220px;
        }
        .search-block button {
            background: linear-gradient(90deg, #2575fc 0%, #6a11cb 100%);
            color: #fff;
            border: none;
            border-radius: 20px;
            padding: 10px 24px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(38,135,255,0.2);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .search-block button:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 16px rgba(38,135,255,0.3);
        }
        .books-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            background: rgba(255,255,255,0.7);
            border-radius: 12px;
            overflow: hidden;
            animation: tableFade 1.2s cubic-bezier(.42,0,.58,1);
        }
        @keyframes tableFade {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .books-table th, .books-table td {
            padding: 14px 10px;
            text-align: left;
        }
        .books-table th {
            background: linear-gradient(90deg, #2575fc 0%, #6a11cb 100%);
            color: #fff;
            font-size: 1.1rem;
        }
        .books-table tr {
            transition: background 0.2s;
        }
        .books-table tr:hover {
            background: #e3eaff;
        }
        .books-table td {
            font-size: 1rem;
        }
        .waves {
            position: absolute;
            left: 0; right: 0; bottom: -40px;
            width: 100%;
            height: 120px;
            z-index: -1;
        }
        .waves svg {
            width: 100%;
            height: 100%;
            display: block;
            animation: waveMove 8s linear infinite;
        }
        @keyframes waveMove {
            0% { transform: translateX(0); }
            100% { transform: translateX(-100px); }
        }
        .fancy-logout {
            display: inline-flex;
            align-items: center;
            background: linear-gradient(90deg, #6a11cb 0%, #2575fc 100%);
            color: #fff !important;
            font-weight: 700;
            border-radius: 30px;
            padding: 12px 28px;
            box-shadow: 0 4px 16px rgba(38,135,255,0.15);
            text-decoration: none;
            font-size: 1.1rem;
            margin-top: 18px;
            margin-right: 30px;
            transition: background 0.2s, transform 0.2s, box-shadow 0.2s;
            border: none;
        }
        .fancy-logout:hover {
            background: linear-gradient(90deg, #2575fc 0%, #6a11cb 100%);
            color: #fff;
            transform: scale(1.08);
            box-shadow: 0 8px 32px rgba(38,135,255,0.25);
        }
        .fancy-logout svg {
            transition: transform 0.3s;
        }
        .fancy-logout:hover svg {
            transform: translateX(6px);
        }
    </style>
</head>
<body>
    <a class="logout-link fancy-logout" href="/logout">
        <span>Выйти</span>
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" style="vertical-align:middle;margin-left:8px;">
            <path d="M16 17L21 12L16 7" stroke="#2575fc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M21 12H9" stroke="#2575fc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M5 3H12C13.1046 3 14 3.89543 14 5V7" stroke="#2575fc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M14 17V19C14 20.1046 13.1046 21 12 21H5C3.89543 21 3 20.1046 3 19V5C3 3.89543 3.89543 3 5 3Z" stroke="#2575fc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
    </a>
    <div class="header">Панель пользователя библиотеки</div>
    <div class="main">
        <h2 style="color:#2575fc;text-align:center;">Добро пожаловать, <span th:text="${#authentication.name}"></span>!</h2>
        <div class="search-block">
            <button onclick="fetchAllBooks()">Показать все книги</button>
            <input type="text" id="searchId" placeholder="Поиск по ID">
            <button onclick="searchById()">Найти</button>
            <input type="text" id="searchIsbn" placeholder="Поиск по ISBN">
            <button onclick="searchByIsbn()">Найти</button>
        </div>
        <div id="booksContainer"></div>
    </div>
    <div class="waves">
        <svg viewBox="0 0 1200 120" preserveAspectRatio="none">
            <path d="M0,0 C300,100 900,0 1200,100 L1200,120 L0,120 Z" fill="#fff" fill-opacity="0.3">
                <animate attributeName="d" dur="6s" repeatCount="indefinite"
                    values="M0,0 C300,100 900,0 1200,100 L1200,120 L0,120 Z;
                            M0,0 C400,0 800,100 1200,0 L1200,120 L0,120 Z;
                            M0,0 C300,100 900,0 1200,100 L1200,120 L0,120 Z" />
            </path>
        </svg>
    </div>
    <script>
        // API endpoints
        const API = {
            all: '/api/library/allbooks',
            byId: id => `/api/library/${id}`,
            byIsbn: isbn => `/api/library/isbn/${isbn}`
        };

        // Получить все книги
        async function fetchAllBooks() {
            const res = await fetch(API.all);
            const books = await res.json();
            renderBooksTable(books);
        }

        // Поиск по ID
        async function searchById() {
            const id = document.getElementById('searchId').value.trim();
            if (!id) return;
            const res = await fetch(API.byId(id));
            if (res.ok) {
                const book = await res.json();
                renderBooksTable([book]);
            } else {
                renderBooksTable([]);
            }
        }

        // Поиск по ISBN
        async function searchByIsbn() {
            const isbn = document.getElementById('searchIsbn').value.trim();
            if (!isbn) return;
            const res = await fetch(API.byIsbn(isbn));
            if (res.ok) {
                const book = await res.json();
                renderBooksTable([book]);
            } else {
                renderBooksTable([]);
            }
        }

        // Рендер таблицы книг
        function renderBooksTable(books) {
            const container = document.getElementById('booksContainer');
            if (!books || books.length === 0) {
                container.innerHTML = '<div style="text-align:center;color:#2575fc;font-size:1.3rem;margin-top:30px;">Нет данных</div>';
                return;
            }
            let html = `<table class="books-table">
                <thead><tr>
                    <th>ID</th><th>Название</th><th>Автор</th><th>ISBN</th><th>Жанр</th><th>Описание</th>
                </tr></thead><tbody>`;
            for (const book of books) {
                html += `<tr>
                    <td>${book.id}</td>
                    <td>${book.title}</td>
                    <td>${book.author}</td>
                    <td>${book.isbn}</td>
                    <td>${book.genre}</td>
                    <td>${book.description}</td>
                </tr>`;
            }
            html += '</tbody></table>';
            container.innerHTML = html;
        }
    </script>
</body>
</html>
