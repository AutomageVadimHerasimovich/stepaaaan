<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Панель пользователя</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #f4f7fa; margin: 0; }
        .container { max-width: 700px; margin: 40px auto; background: #fff; border-radius: 12px; box-shadow: 0 4px 16px rgba(40,60,120,0.10); padding: 2rem; }
        h2 { color: #2575fc; margin-bottom: 1.5rem; }
        .actions { margin-bottom: 2rem; }
        .actions a { display: inline-block; margin-right: 1rem; background: #2575fc; color: #fff; padding: 0.7rem 1.2rem; border-radius: 6px; text-decoration: none; font-weight: 500; }
        .actions a:hover { background: #6a11cb; }
        .logout-link { float: right; color: #2575fc; text-decoration: none; font-weight: 500; }
        .logout-link:hover { text-decoration: underline; }
    </style>
</head>
<body>
<div class="container">
    <a class="logout-link" href="/logout">Выйти</a>
    <h2>Добро пожаловать, <span th:text="${#authentication.name}"></span>!</h2>
    <div class="actions">
        <a href="api/library/allbooks">Просмотреть книги</a>
        <a href="api/api/api/library/isbn/">Посмотреть книгу по ISBN</a>
    </div>
    <div>
        <p>Выберите действие выше для работы с библиотекой.</p>
    </div>
</div>
</body>
</html>
