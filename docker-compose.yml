version: "3.8"

services:
  backend:
    image: library_backend
    networks:
      - shared-net
    ports:
      - "8080:8080"
    build:
      context: ./backend
    depends_on:
      library_db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://library_db:5432/${DB_NAME}
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
  library_db:
    image: postgres:latest
    networks:
      - shared-net
    container_name: library_db
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
        - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 3s
      timeout: 5s
      retries: 5
    volumes:
       - db-data:/var/lib/postgresql/data

volumes:
  db-data:

networks:
  shared-net:
    external: true