version: "3.8"

services:
  library-backend:
    image: library_backend
    networks:
      - shared-net
    ports:
      - "8080:8080"
    build:
      context: ./main-service
    depends_on:
      library_db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://library_db:5432/${DB_NAME}
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
  library_db:
    image: postgres:latest
    networks:
      - shared-net
    container_name: library_db
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
        - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 3s
      timeout: 5s
      retries: 5
    volumes:
       - db-data:/var/lib/postgresql/data
  record-service-backend:
    image: record_service_backend
    build:
      context: ./record-service
    networks:
      - shared-net
    ports:
      - "8081:8080"
    depends_on:
      - record-service-db
      - rabbitmq
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://record-service-db:5432/record_service_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_RABBITMQ_HOST: rabbitmq
  record-service-db:
    image: postgres:latest
    networks:
      - shared-net
    environment:
      POSTGRES_DB: record_service_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
  rabbitmq:
    image: rabbitmq:3-management
    networks:
      - shared-net
    ports:
      - "5672:5672"
      - "15672:15672"

volumes:
  db-data:

networks:
  shared-net:
    external: true